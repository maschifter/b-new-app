project_id = "bnewapp"

[api]
enabled = true
port = 54321

[db]
port = 54322

# apps/edu signs in anonymously on first launch. The hosted project needs the matching
# dashboard switch (Authentication > Sign In / Providers > Anonymous sign-ins); this entry
# only covers the local stack.
[auth]
enable_anonymous_sign_ins = true

[storage.buckets.catalog-art]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.dance-media]
public = true
file_size_limit = "45MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "video/mp4", "audio/mpeg", "audio/mp4"]

[storage.buckets.dance-videos]
public = false
file_size_limit = "45MiB"
allowed_mime_types = ["video/mp4"]
